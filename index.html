
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="MzUA0ik9g0lowHFAuUKu-zGsHyW3uw7TU7bH_Wl4cmg" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ready 4 Guest | Coming Soon</title>
    <meta name="description" content="Ready 4 Guest — A smarter way to manage properties and reservations. Coming soon.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 8%;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #3b91ff;
        }

        .status {
            color: #93c5fd;
            border: 1px solid #244879;
            padding: 9px 14px;
            border-radius: 30px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 20px 100px;
        }

        .icon {
            width: 90px;
            height: 90px;
            display: grid;
            place-items: center;
            background: #14284b;
            border: 1px solid #244879;
            border-radius: 25px;
            color: #60a5fa;
            font-size: 42px;
            margin-bottom: 35px;
            box-shadow: 0 0 60px #2563eb20;
        }

        .eyebrow {
            color: #60a5fa;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 76px);
            letter-spacing: -2px;
            max-width: 850px;
            line-height: 1.1;
            margin-bottom: 24px;
        }

        h1 span {
            color: #60a5fa;
        }

        .description {
            color: #a8b4ca;
            font-size: 17px;
            line-height: 1.8;
            max-width: 520px;
            margin-bottom: 38px;
        }

        .coming {
            display: inline-block;
            background: #2589ff;
            color: white;
            padding: 16px 34px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            box-shadow: 0 8px 35px #2589ff35;
        }

        .creator {
            margin-top: 65px;
        }

        .creator p {
            color: #71809b;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .creator h2 {
            font-size: 17px;
            letter-spacing: 3px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            border-top: 1px solid #202b40;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            header {
                padding: 24px 5%;
            }

            .logo {
                font-size: 16px;
            }

            .status {
                font-size: 9px;
                padding: 8px;
            }

            h1 {
                letter-spacing: -1px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">READY <span>4</span> GUEST</div>
        <div class="status">IN DEVELOPMENT</div>
    </header>

    <main>
        <div class="icon">⌂</div>

        <p class="eyebrow">THE FUTURE OF PROPERTY MANAGEMENT</p>

        <h1>Something great<br>is <span>coming.</span></h1>

        <p class="description">
            A smarter way to manage your properties and reservations.
            A new experience is on its way.
        </p>

        <div class="coming">COMING SOON</div>

        <div class="creator">
            <p>AN INDEPENDENT PROJECT BY</p>
            <h2>MATEUS MEDEIROS</h2>
        </div>
    </main>

    <footer>
        READY 4 GUEST &copy; 2026 — ALL RIGHTS RESERVED
    </footer>
</body>
</html>
